# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use bash on every runner (incl. Windows, where it ships via Git Bash) so
# `run:` commands parse identically. PowerShell mangles args like
# -coverprofile=coverage.out, splitting them into bogus package paths.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -v ./...

      # Upload coverage once (from the Linux leg); the profile is identical
      # across the matrix for this pure-Go package. Requires the CODECOV_TOKEN
      # repo secret. fail_ci_if_error stays false so a flaky upload or a
      # missing token can't break an otherwise-green build.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Benchmark
        run: go test -bench=. -benchmem -run=^$ ./...

  # Track benchmark performance over time and alert on regressions.
  # Runs only on pushes to master: storing history and posting alert comments
  # need a writable token, which PRs from forks/Dependabot don't get. Pinned
  # to a single OS so numbers are comparable run-to-run.
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push results to the benchmark-data branch
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # GitHub's bash runs with `set -o pipefail`, so a failing `go test`
      # still fails this step despite the pipe into tee.
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark-output.txt

      # Appends the result to the orphan `benchmark-data` branch (a trend
      # chart lives at dev/bench/index.html there). alert-threshold 200%
      # tolerates shared-runner variance; fail-on-alert is false so a noisy
      # spike comments but never reddens the build.
      - name: Store benchmark result and alert on regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fifomu benchmarks
          tool: go
          output-file-path: benchmark-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@neilotoole'

