# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use bash on every runner (incl. Windows, where it ships via Git Bash) so
# `run:` commands parse identically. PowerShell mangles args like
# -coverprofile=coverage.out, splitting them into bogus package paths.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -v ./...

      # Upload coverage once (from the Linux leg); the profile is identical
      # across the matrix for this pure-Go package. Requires the CODECOV_TOKEN
      # repo secret. fail_ci_if_error stays false so a flaky upload or a
      # missing token can't break an otherwise-green build.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Benchmark
        run: go test -bench=. -benchmem -run=^$ ./...

  # Track benchmark performance over time and alert on regressions.
  # Runs only on pushes to master: storing history and posting alert comments
  # need a writable token, which PRs from forks/Dependabot don't get. Pinned
  # to a single OS so numbers are comparable run-to-run.
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push results to the benchmark-data branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GitHub's bash runs with `set -o pipefail`, so a failing `go test`
      # still fails this step despite the pipe into tee.
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark-output.txt

      # Appends the result to the orphan `benchmark-data` branch (a trend
      # chart lives at dev/bench/index.html there). alert-threshold 200%
      # tolerates shared-runner variance; fail-on-alert is false so a noisy
      # spike comments but never reddens the build.
      - name: Store benchmark result and alert on regression
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fifomu benchmarks
          tool: go
          output-file-path: benchmark-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          auto-push: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@neilotoole'

  # PR-time comparison: benchmark the PR head and compare it against the
  # master baseline stored on benchmark-data, without writing the PR's own
  # numbers back to history. Skipped for forks and Dependabot, whose
  # pull_request GITHUB_TOKEN is read-only and can neither read secrets nor
  # post comments — running there would only error.
  bench-pr:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read # fetch the baseline branch
      pull-requests: write # post the comparison comment
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark-output.txt

      # Compares against the latest benchmark-data entry. summary-always
      # renders the full diff in the run summary every time; comment-on-alert
      # posts a PR comment only on a >=200% regression. auto-push/save-data-file
      # are off so PR numbers never enter the master trend, and fail-on-alert
      # is off so the check never reddens.
      - name: Compare against baseline
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fifomu benchmarks
          tool: go
          output-file-path: benchmark-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          auto-push: false
          save-data-file: false
          summary-always: true
          alert-threshold: '200%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@neilotoole'


  # Same-machine PR comparison: benchmark the PR's base and head commits
  # inside one job, so both run on the same VM. bench-pr above compares
  # against a stored result that was usually produced on a different CPU
  # model (ubuntu-latest hands out whatever is free), which makes its
  # ratios unreliable; here hardware cancels out.
  #
  # The two test binaries run alternately, so drift in a noisy shared
  # runner is spread across both sides, and benchstat reports which
  # differences are statistically significant. Needs only read access, so
  # it also runs for forks. Results are informational: the job fails only
  # if a build or benchmark run fails.
  bench-compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Rounds per side. benchstat needs at least 6 samples to call a
      # difference significant at its default confidence level.
      ROUNDS: 6
    steps:
      - uses: actions/checkout@v7
        with:
          path: head

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v7
        with:
          go-version-file: head/go.mod
          cache-dependency-path: |
            head/go.sum
            base/go.sum

      - name: Build benchmark binaries
        run: |
          (cd base && go test -c -o ../base.test .)
          (cd head && go test -c -o ../head.test .)

      - name: Run benchmarks (base and head interleaved)
        run: |
          for i in $(seq "$ROUNDS"); do
            echo "::group::round $i of $ROUNDS"
            ./base.test -test.run='^$' -test.bench=. -test.benchmem | tee -a base.txt
            ./head.test -test.run='^$' -test.bench=. -test.benchmem | tee -a head.txt
            echo "::endgroup::"
          done

      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          {
            echo '### Benchmarks: base vs. head, same runner'
            echo
            echo "Base \`${{ github.event.pull_request.base.sha }}\`, head \`${{ github.event.pull_request.head.sha }}\`, $ROUNDS interleaved rounds each."
            echo
            echo '```'
            benchstat base=base.txt head=head.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
