# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [master]
  pull_request:

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR branch).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Use bash on every runner (incl. Windows, where it ships via Git Bash) so
# `run:` commands parse identically. PowerShell mangles args like
# -coverprofile=coverage.out, splitting them into bogus package paths.
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out -v ./...

      # Upload coverage once (from the Linux leg); the profile is identical
      # across the matrix for this pure-Go package. Requires the CODECOV_TOKEN
      # repo secret. fail_ci_if_error stays false so a flaky upload or a
      # missing token can't break an otherwise-green build.
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Benchmark
        run: go test -bench=. -benchmem -run=^$ ./...

  # Exhaustive checks, at bounds too slow for every `go test` run:
  #
  #   - TestModel_ExhaustiveInterleavings explores every interleaving of
  #     a model of the locking protocol, for small numbers of threads.
  #   - TestScenarios_Exhaustive runs every sequence of API calls up to a
  #     given length against a reference model.
  #
  # Both also run, at smaller bounds, as part of build-test. No race
  # detector here: the model checker is single-threaded, and the
  # scenarios run one call at a time.
  exhaustive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Model-check the locking protocol
        env:
          FIFOMU_MODEL: 2x4,3x2,4x1
        run: go test -run '^TestModel_' -v -timeout 25m .

      - name: Enumerate API scenarios
        env:
          FIFOMU_SCENARIO_LEN: 8
        run: go test -run '^TestScenarios_' -v -timeout 25m .

  # Track benchmark performance over time. Runs only on pushes to master:
  # storing history needs a writable token, which PRs from forks/Dependabot
  # don't get. Pinned to a single OS, but ubuntu-latest still hands out
  # different CPU models from run to run, so read the results as a trend.
  bench:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push results to the benchmark-data branch
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GitHub's bash runs with `set -o pipefail`, so a failing `go test`
      # still fails this step despite the pipe into tee.
      - name: Run benchmarks
        run: go test -bench=. -benchmem -run=^$ ./... | tee benchmark-output.txt

      # Appends the result to the orphan `benchmark-data` branch (a trend
      # chart lives at dev/bench/index.html there). Regression alerts are
      # off: consecutive runs often land on different CPU models, which
      # made unchanged code look more than 3x slower and fired false
      # alarms. Regressions are caught at PR time by bench-compare.
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: fifomu benchmarks
          tool: go
          output-file-path: benchmark-output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: benchmark-data
          auto-push: true
          comment-on-alert: false
          fail-on-alert: false

  # PR-time comparison: benchmark the PR's base and head commits inside
  # one job, so both run on the same VM. Comparing against the result
  # stored on benchmark-data doesn't work: ubuntu-latest hands out whatever
  # CPU model is free, so that result usually comes from different
  # hardware, and unchanged code can appear several times slower.
  #
  # The two test binaries run alternately, so drift in a noisy shared
  # runner is spread across both sides, and benchstat reports which
  # differences are statistically significant. Needs only read access, so
  # it also runs for forks. Results are informational: the job fails only
  # if a build or benchmark run fails.
  bench-compare:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Rounds per side. benchstat needs at least 6 samples to call a
      # difference significant at its default confidence level.
      ROUNDS: 6
    steps:
      - uses: actions/checkout@v7
        with:
          path: head

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v7
        with:
          go-version-file: head/go.mod
          cache-dependency-path: |
            head/go.sum
            base/go.sum

      - name: Build benchmark binaries
        run: |
          (cd base && go test -c -o ../base.test .)
          (cd head && go test -c -o ../head.test .)

      - name: Run benchmarks (base and head interleaved)
        run: |
          for i in $(seq "$ROUNDS"); do
            echo "::group::round $i of $ROUNDS"
            ./base.test -test.run='^$' -test.bench=. -test.benchmem | tee -a base.txt
            ./head.test -test.run='^$' -test.bench=. -test.benchmem | tee -a head.txt
            echo "::endgroup::"
          done

      - name: Compare with benchstat
        run: |
          go install golang.org/x/perf/cmd/benchstat@latest
          {
            echo '### Benchmarks: base vs. head, same runner'
            echo
            echo "Base \`${{ github.event.pull_request.base.sha }}\`, head \`${{ github.event.pull_request.head.sha }}\`, $ROUNDS interleaved rounds each."
            echo
            echo '```'
            benchstat base=base.txt head=head.txt
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
